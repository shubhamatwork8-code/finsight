services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: finsight
      POSTGRES_PASSWORD: finsight
      POSTGRES_DB: finsight
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finsight -d finsight"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql+psycopg://finsight:finsight@db:5432/finsight
      # In production, replace SECRET_KEY with a secure random string
      - SECRET_KEY=replace-with-a-long-random-string
      # You can replace this with your actual domain when deploying live
      - CORS_ORIGINS=* 
      - SEED_ON_STARTUP=true
      - DEMO_PASSWORD=FinSight-secure-demo-1
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
